<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Every Day Goal Calendar</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
    <link rel="alternate icon" href="{{ url_for('static', filename='favicon.ico') }}">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Condensed:wght@700&display=swap" rel="stylesheet">
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-auth-compat.js"></script>
    
    <!-- Custom Styles -->
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        .font-header {
            font-family: 'Roboto Condensed', sans-serif;
        }

        .day-hexagon {
            clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
            transition: background-color 0.2s ease, box-shadow 0.2s ease, color 0.2s ease;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .day-hexagon::before {
            content: attr(data-day);
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
            transform: scale(0.9); 
            transition: background-color 0.2s ease, color 0.2s ease, transform 0.2s ease;
        }

        .day-hexagon.lit {
            background-color: #ffd700;
            box-shadow: 0 0 8px #ffd700, 0 0 12px #ffd700;
            font-weight: 700;
        }
        .day-hexagon.lit::before {
            background-color: #ffd700;
            color: #333;
        }

        .day-hexagon:not(.lit):not(.invalid) {
            background-color: #856a3d;
            cursor: pointer;
        }
        .day-hexagon:not(.lit):not(.invalid)::before {
            background-color: #574627;
            color: #d4af37;
        }
        
        .day-hexagon:not(.lit):not(.invalid):hover {
            background-color: #d4af37;
        }
        .day-hexagon:not(.lit):not(.invalid):hover::before {
            background-color: #856a3d;
            color: #f0e6d2;
            transform: scale(0.92);
        }

        .day-hexagon.invalid {
            visibility: hidden;
            cursor: default;
            box-shadow: none;
            background-color: transparent;
        }
        .day-hexagon.invalid::before {
            display: none;
        }

        /* Loading Screen Styles */
        #loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #111827;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease-out, visibility 0.5s ease-out;
        }

        #loading-screen.hidden {
            opacity: 0;
            visibility: hidden;
        }

        .loading-text {
            color: #d4af37;
            font-family: 'Roboto Condensed', sans-serif;
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: 0.1em;
            margin-bottom: 60px;
        }

        .boxes {
            height: 32px;
            width: 32px;
            position: relative;
            -webkit-transform-style: preserve-3d;
            transform-style: preserve-3d;
            -webkit-transform-origin: 50% 50%;
            transform-origin: 50% 50%;
            margin-top: 32px;
            -webkit-transform: rotateX(60deg) rotateZ(45deg) rotateY(0deg) translateZ(0px);
            transform: rotateX(60deg) rotateZ(45deg) rotateY(0deg) translateZ(0px);
        }

        .boxes .box {
            width: 32px;
            height: 32px;
            top: 0px;
            left: 0;
            position: absolute;
            -webkit-transform-style: preserve-3d;
            transform-style: preserve-3d;
        }

        .boxes .box:nth-child(1) {
            -webkit-transform: translate(100%, 0);
            transform: translate(100%, 0);
            -webkit-animation: box1 1s linear infinite;
            animation: box1 1s linear infinite;
        }

        .boxes .box:nth-child(2) {
            -webkit-transform: translate(0, 100%);
            transform: translate(0, 100%);
            -webkit-animation: box2 1s linear infinite;
            animation: box2 1s linear infinite;
        }

        .boxes .box:nth-child(3) {
            -webkit-transform: translate(100%, 100%);
            transform: translate(100%, 100%);
            -webkit-animation: box3 1s linear infinite;
            animation: box3 1s linear infinite;
        }

        .boxes .box:nth-child(4) {
            -webkit-transform: translate(200%, 0);
            transform: translate(200%, 0);
            -webkit-animation: box4 1s linear infinite;
            animation: box4 1s linear infinite;
        }

        .boxes .box > div {
            background: #ffd700;
            --translateZ: 15.5px;
            --rotateY: 0deg;
            --rotateX: 0deg;
            position: absolute;
            width: 100%;
            height: 100%;
            top: auto;
            right: auto;
            bottom: auto;
            left: auto;
            -webkit-transform: rotateY(var(--rotateY)) rotateX(var(--rotateX)) translateZ(var(--translateZ));
            transform: rotateY(var(--rotateY)) rotateX(var(--rotateX)) translateZ(var(--translateZ));
        }

        .boxes .box > div:nth-child(1) {
            top: 0;
            left: 0;
            background: #ffd700;
        }

        .boxes .box > div:nth-child(2) {
            background: #daa520;
            right: 0;
            --rotateY: 90deg;
        }

        .boxes .box > div:nth-child(3) {
            background: #f0e68c;
            --rotateX: -90deg;
        }

        .boxes .box > div:nth-child(4) {
            background: #ffe680;
            top: 0;
            left: 0;
            --translateZ: -90px;
        }

        @keyframes box1 {
            0%, 50% {
                transform: translate(100%, 0);
            }
            100% {
                transform: translate(200%, 0);
            }
        }

        @keyframes box2 {
            0% {
                transform: translate(0, 100%);
            }
            50% {
                transform: translate(0, 0);
            }
            100% {
                transform: translate(100%, 0);
            }
        }

        @keyframes box3 {
            0%, 50% {
                transform: translate(100%, 100%);
            }
            100% {
                transform: translate(0, 100%);
            }
        }

        @keyframes box4 {
            0% {
                transform: translate(200%, 0);
            }
            50% {
                transform: translate(200%, 100%);
            }
            100% {
                transform: translate(100%, 100%);
            }
        }

        .hex-face {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 24px;
            clip-path: polygon(30% 0%, 70% 0%, 100% 50%, 70% 100%, 30% 100%, 0% 50%);
        }

        .hex-top {
            background: linear-gradient(135deg, #ffd700 0%, #f0c814 100%);
            transform: translateZ(20px);
        }

        .hex-front {
            background: linear-gradient(135deg, #e6b800 0%, #d4af37 100%);
            transform: rotateY(60deg) translateZ(20px);
        }

        .hex-back {
            background: linear-gradient(135deg, #d4af37 0%, #cc9900 100%);
            transform: rotateY(120deg) translateZ(20px);
        }

        .hex-left {
            background: linear-gradient(135deg, #cc9900 0%, #b8941f 100%);
            transform: rotateY(180deg) translateZ(20px);
        }

        .hex-right {
            background: linear-gradient(135deg, #b8941f 0%, #a0751a 100%);
            transform: rotateY(240deg) translateZ(20px);
        }

        .hex-bottom {
            background: linear-gradient(135deg, #a0751a 0%, #8b6914 100%);
            transform: rotateY(300deg) translateZ(20px);
        }

        @keyframes hexRotate {
            0% {
                transform: rotateX(0deg) rotateY(0deg) rotateZ(0deg);
            }
            100% {
                transform: rotateX(360deg) rotateY(360deg) rotateZ(360deg);
            }
        }

        @keyframes hexBounce {
            0%, 100% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-20px);
            }
        }
    </style>
</head>
<body class="text-white flex flex-col items-center justify-center min-h-screen p-2 sm:p-6 transition-colors duration-300 antialiased">

    <!-- Loading Screen -->
    <div id="loading-screen">
        <div class="loading-text">LOADING CALENDAR</div>
        <div class="boxes">
            <div class="box">
                <div></div>
                <div></div>
                <div></div>
                <div></div>
            </div>
            <div class="box">
                <div></div>
                <div></div>
                <div></div>
                <div></div>
            </div>
            <div class="box">
                <div></div>
                <div></div>
                <div></div>
                <div></div>
            </div>
            <div class="box">
                <div></div>
                <div></div>
                <div></div>
                <div></div>
            </div>
        </div>
    </div>

    <!-- User Info and Logout -->
    <div class="fixed top-4 right-4 flex items-center gap-4">
        <span class="text-sm text-gray-400">{{ user_email }}</span>
        <button onclick="signOut()" class="px-4 py-2 bg-gray-700 text-white rounded-lg hover:bg-gray-600 transition-colors text-sm">
            Logout
        </button>
    </div>

    <!-- Main Title -->
    <h1 class="text-2xl sm:text-3xl font-bold text-gray-400 mb-4 font-header tracking-wider">EveryDay Goal Calendar</h1>

    <!-- Theme Selector -->
    <div class="flex flex-col items-center gap-2 mb-4">
        <label class="text-xs text-gray-500 font-medium tracking-wider">THEME</label>
        <div id="theme-selector" class="flex gap-3">
            <!-- Swatches will be added here by JS -->
        </div>
    </div>

    <!-- Calendar Assembly -->
    <div class="calendar-assembly w-full max-w-xl lg:max-w-2xl">
        <div class="calendar-frame bg-[#e0cfa9] p-2 sm:p-4 rounded-lg shadow-[0_10px_20px_rgba(0,0,0,0.1),_0_6px_6px_rgba(0,0,0,0.1)] w-full">
            <div class="calendar-backplate bg-gray-950 p-2 sm:p-4 rounded relative">
                
                <!-- Decorative Screws -->
                <div class="screw absolute top-2 left-2 w-2 h-2 bg-gray-800 rounded-full"></div>
                <div class="screw absolute top-2 right-2 w-2 h-2 bg-gray-800 rounded-full"></div>
                <div class="screw absolute bottom-2 left-2 w-2 h-2 bg-gray-800 rounded-full"></div>
                <div class="screw absolute bottom-2 right-2 w-2 h-2 bg-gray-800 rounded-full"></div>
                <div class="screw absolute top-1/2 left-1.5 w-2 h-2 bg-gray-800 rounded-full -translate-y-1/2"></div>
                <div class="screw absolute top-1/2 right-1.5 w-2 h-2 bg-gray-800 rounded-full -translate-y-1/2"></div>
                <div class="screw absolute top-1/4 left-1.5 w-2 h-2 bg-gray-800 rounded-full -translate-y-1/2"></div>
                <div class="screw absolute top-1/4 right-1.5 w-2 h-2 bg-gray-800 rounded-full -translate-y-1/2"></div>
                <div class="screw absolute top-3/4 left-1.5 w-2 h-2 bg-gray-800 rounded-full -translate-y-1/2"></div>
                <div class="screw absolute top-3/4 right-1.5 w-2 h-2 bg-gray-800 rounded-full -translate-y-1/2"></div>

                <!-- Month Headers -->
                <div id="month-headers" class="grid grid-cols-12 gap-0.5 sm:gap-1 mb-2">
                    <!-- Headers will be injected here -->
                </div>

                <!-- Calendar Grid -->
                <div id="calendar-grid" class="grid grid-cols-12 gap-0.5 sm:gap-1">
                    <!-- Day hexagons will be injected here -->
                </div>

                <!-- Footer -->
                <div class="calendar-footer flex justify-between items-center mt-3 sm:mt-4 px-4 h-6 sm:h-7">
                    <!-- Empty footer -->
                </div>

            </div>
        </div>

        <!-- Calendar Legs -->
        <div class="calendar-legs flex justify-between w-full px-6 -mt-2">
            <div class="leg w-12 h-6 bg-[#e0cfa9] rounded-b-md shadow-md border-t border-black/10"></div>
            <div class="leg w-12 h-6 bg-[#e0cfa9] rounded-b-md shadow-md border-t border-black/10"></div>
        </div>
    </div>

    <!-- Firebase Auth Script -->
    <script src="{{ url_for('static', filename='firebase-auth.js') }}"></script>
    
    <!-- Calendar Application Script -->
    <script src="{{ url_for('static', filename='calendar.js') }}"></script>
    
    <!-- Loading Screen Controller -->
    <script>
        // Hide loading screen when everything is ready
        function hideLoadingScreen() {
            const loadingScreen = document.getElementById('loading-screen');
            if (loadingScreen) {
                loadingScreen.classList.add('hidden');
            }
        }

        // Fallback timers to ensure loading screen doesn't stay forever
        document.addEventListener('DOMContentLoaded', () => {
            // Auto-hide after 5 seconds if nothing else hides it
            setTimeout(() => {
                const loadingScreen = document.getElementById('loading-screen');
                if (loadingScreen && !loadingScreen.classList.contains('hidden')) {
                    console.log('Auto-hiding loading screen after timeout');
                    hideLoadingScreen();
                }
            }, 5000);
        });

        // Additional fallback when window is fully loaded
        window.addEventListener('load', () => {
            setTimeout(() => {
                const loadingScreen = document.getElementById('loading-screen');
                if (loadingScreen && !loadingScreen.classList.contains('hidden')) {
                    hideLoadingScreen();
                }
            }, 3000);
        });
    </script>
</body>
</html>
